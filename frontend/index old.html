<script src="/lib/jquery/dist/jquery.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.7/signalr.min.js"></script>

<script>
    const input = document.getElementById("scanInput");
    const result = document.getElementById("result");
    const progressText = document.getElementById("progressText");
    const progressBar = document.getElementById("progressBar");
    const jobId = document.getElementById("jobId").value;
    let isCompleted = false;

    // ======================
    // SIGNALR
    // ======================
    const connection = new signalR.HubConnectionBuilder()
        .withUrl("/scanHub")
        .configureLogging(signalR.LogLevel.Information)
        .build();

    connection.start()
        .then(() => console.log("SignalR Connected"))
        .catch(err => console.error(err));

    connection.on("ReceiveScanUpdate", function (receiveJobId, total, target, status) {
        if (parseInt(receiveJobId) !== parseInt(jobId))
            return;
        updateProgress(total, target);
        result.insertAdjacentHTML(
            "afterbegin",
            `<div class="text-info">${total}/${target} | ${status}</div>`
        );
        if (status === "COMPLETE" && !isCompleted) {
            isCompleted = true;
            input.disabled = true;
            setTimeout(() => {
                alert("JOB COMPLETE");
                window.location.href = "/OQC/Detail/" + jobId;
            }, 300);
        }
    });

    // ======================
    // PROGRESS BAR
    // ======================
    function updateProgress(total, target) {
        progressText.innerText = total + " / " + target;
        document.getElementById("total").innerText = total;
        document.getElementById("target").innerText = target;

        let percent = Math.min(100, (total / target) * 100);
        progressBar.style.width = percent + "%";

        const btnComplete = document.getElementById("btnComplete");
        if (btnComplete) {
            if (total > 0) {
                btnComplete.disabled = false;
                btnComplete.classList.remove("btn-secondary");
                btnComplete.classList.add("btn-success");
            } else {
                btnComplete.disabled = true;
                btnComplete.classList.remove("btn-success");
                btnComplete.classList.add("btn-secondary");
            }
        }
    }

    // ======================
    // SCAN
    // ======================
    input.addEventListener("keydown", function (e) {
        if (e.key !== "Enter")
            return;
        e.preventDefault();
        if (isCompleted)
            return;

        let serial = input.value.trim();
        if (!serial)
            return;


        fetch('/OQC/AddScan', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded'
            },
            body: `OQCJobId=${jobId}&serialNumber=${encodeURIComponent(serial)}`
        })
            .then(res => {
                if (!res.ok) {
                    return res.text().then(t => {
                        throw t;
                    });
                }
                return res.json();
            })
            .then(data => {
                result.insertAdjacentHTML(
                    "afterbegin",
                    `<div class="text-success fw-bold">✔ ${serial}</div>`
                );
                updateProgress(data.total, data.target);
                input.value = "";
                input.focus();
                if (data.status === "COMPLETE" && !isCompleted) {
                    isCompleted = true;
                    input.disabled = true;
                    alert("JOB COMPLETE");
                    window.location.href = "/OQC/Detail/" + jobId;
                    return;
                }
            })
            .catch(err => {
                alert(err);
                input.value = "";
                input.focus();
            });
    });

    // ======================
    // FORCE COMPLETE
    // ======================
    function forceComplete() {
        let currentTotal = parseInt(document.getElementById("total").innerText);
        if (currentTotal <= 0) {
            alert("NO SCAN DATA");
            return;
        }
        let reason = prompt("Complete Reason");
        if (!reason)
            return;

        fetch('/OQC/ForceComplete', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded'
            },
            body: `id=${jobId}&reason=${encodeURIComponent(reason)}`
        })
            .then(r => {
                if (!r.ok)
                    throw "FORCE COMPLETE FAILED";
                return r.text();
            })
            .then(() => {
                alert("JOB COMPLETE");
                window.location.href = "/OQC/Detail/" + jobId;
            })
            .catch(err => {
                alert(err);
            });
    }

    // ======================
    // CANCEL
    // ======================
    function cancelJob() {
        if (!confirm("Cancel Job ?"))
            return;

        fetch('/OQC/Cancel', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded'
            },
            body: `id=${jobId}`
        })
            .then(() => {
                alert("JOB CANCELED");
                window.location.href = "/OQC/List";
            });
    }

    // ======================
    // POLLING BACKUP
    // ======================
    let polling = setInterval(() => {
        if (isCompleted) {
            clearInterval(polling);
            return;
        }
        fetch(`/OQC/GetProgress?id=${jobId}`)
            .then(r => r.json())
            .then(data => {
                updateProgress(data.total, data.target);
                if (data.status === "COMPLETE" && !isCompleted) {
                    isCompleted = true;
                    clearInterval(polling);
                    window.location.href = "/OQC/Detail/" + jobId;
                }
            });
    }, 3000);

    // ======================
    // STARTUP
    // ======================
    window.onload = () => {
        input.focus();
        fetch(`/OQC/GetProgress?id=${jobId}`)
            .then(r => r.json())
            .then(data => {
                updateProgress(data.total, data.target);
            });
    };
</script>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const toggleBtn = document.getElementById("toggle-btn");
        const sidebar = document.getElementById("sidebar");

        toggleBtn.addEventListener("click", function (e) {
            e.stopPropagation();
            sidebar.classList.toggle("collapsed");
        });

        document.addEventListener("click", function (e) {
            if (!sidebar.contains(e.target) && e.target !== toggleBtn) {
                sidebar.classList.add("collapsed");
            }
        });
    });
</script>
